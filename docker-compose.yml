services:
  q3eded_service:
    image: myq3srv
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      FS_GAME: ${FS_GAME:-baseq3}
      RCONPASSWORD: "${RCONPASSWORD:?Set RCONPASSWORD in .env}"
      DEDICATED: ${DEDICATED:-2}
      SERVER_CFG: ${SERVER_CFG:-server.cfg}
    ports:
      - "${PORT:-27960}:27960/udp"
    volumes:
      - "./${FS_GAME:-baseq3}:/home/q3user_svc/.q3a/${FS_GAME:-baseq3}"
      - "./baseq3:/home/q3user_svc/.q3a/baseq3"
